<style>

html,body{height:100%;margin:0;overflow:hidden;background:#3a2c70;font-family:'Baloo 2','Noto Sans Devanagari',system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}

.bub{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#fff;color:#2a1840;border:2px solid #2a1840;border-radius:12px;padding:1px 9px;font-weight:700;font-size:15px;white-space:nowrap;box-shadow:2px 3px 0 rgba(42,24,64,.5)}

ol.plan{margin:6px 0 0;padding-left:22px;font-size:17px;line-height:1.35}

#compass{top:194px}

.sec{font-size:15px;opacity:.75;margin:12px 0 0;font-weight:800}
.cap{font-size:clamp(22px,6vw,30px);font-weight:800;color:var(--pink);margin:2px 0 6px;transform:rotate(-1.5deg);line-height:1.1}
#mini{pointer-events:auto;cursor:pointer}

#scr{background:radial-gradient(ellipse at 50% -10%,rgba(255,176,96,.45),transparent 60%),linear-gradient(180deg,rgba(64,30,104,.55),rgba(24,10,48,.78));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border-radius:30px;box-shadow:0 8px 0 var(--hard),0 26px 60px rgba(10,0,30,.45);animation:rise .5s cubic-bezier(.2,1.3,.4,1) both;position:relative}

.swing{display:inline-block;transform-origin:50% 0;animation:swing 1.6s ease-in-out infinite;font-size:.8em}
@keyframes swing{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.deco i{position:absolute;font-style:normal;font-size:clamp(26px,6vw,48px);opacity:.3;animation:floaty 7s ease-in-out infinite}

.btn{display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(180deg,#ffd964,#ffb41f)}
.btn.pink{background:linear-gradient(180deg,#ff7d9c,#ff3b6f)}
.btn.ghost{background:linear-gradient(180deg,var(--card),var(--card2))}
.btn .ic{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.65);font-size:24px;overflow:hidden;border:2px solid rgba(42,24,64,.35)}
.btn .ic img{width:100%;height:100%;object-fit:cover;object-position:50% 8%}
.btn .tx{display:flex;flex-direction:column;text-align:left;line-height:1.05;flex:1}
.btn .tx small{font-size:13px;font-weight:600;opacity:.8;margin-top:3px}
.btn:has(.ic){justify-content:flex-start;padding:8px 14px}
@media (hover:hover){.btn:hover{filter:brightness(1.07);transform:translateY(-2px)}.btn:active{transform:translateY(4px)}}
.pill{background:linear-gradient(180deg,rgba(70,38,116,.88),rgba(36,18,66,.88));border-radius:18px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
#timer{color:#ffd45e;font-size:28px}
#stam i{background:linear-gradient(90deg,#2dd4bf,#22c55e)}
#aware i{background:linear-gradient(90deg,#fb923c,#ef4444)}
#btns button{background:linear-gradient(180deg,#ffd964,#ffb41f)}
#btns button#bRing{background:linear-gradient(180deg,#ff7d9c,#ff3b6f)}

.lv{background:linear-gradient(180deg,var(--card),var(--card2));border-radius:18px;box-shadow:0 4px 0 var(--ink)}
.lv:not([disabled]):active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

.sec{display:inline-block;background:var(--ink);color:var(--card);padding:1px 12px;border-radius:999px;font-size:13px;letter-spacing:.5px;opacity:1;margin:14px 0 2px}
.srow{border-bottom:2px dashed rgba(127,127,127,.3);padding-bottom:8px}
.hsec{background:rgba(127,127,127,.13);border-radius:16px;padding:8px 12px;margin:9px 0}
.hsec b{font-size:18px}.hsec p{margin:2px 0 0;font-size:16px}
.card::-webkit-scrollbar{width:8px}.card::-webkit-scrollbar-thumb{background:var(--ink);border-radius:8px}
@media (prefers-reduced-motion:reduce){.deco i,.swing,.card{animation:none}}

.comic{border:4px solid #2a1840;border-radius:22px;background:linear-gradient(180deg,#fff7d6,#ffe1a8);color:#2a1840;padding:12px 12px 14px;box-shadow:5px 5px 0 #2a1840;background-image:radial-gradient(rgba(42,24,64,.12) 1.2px,transparent 1.4px),linear-gradient(180deg,#fff7d6,#ffe1a8);background-size:12px 12px,100% 100%}
.comic h2{margin:2px 0 6px;color:#2a1840}
.scene{font-size:72px;line-height:1.05;text-align:center}
.scene.ring{animation:ringshake .45s infinite}.scene.shake{animation:ringshake .25s 6}

.sp{position:relative;background:#fff;border:3px solid #2a1840;border-radius:16px;padding:6px 12px;margin:10px 6px 14px;font-weight:700;font-size:17px;line-height:1.25;color:#2a1840}
.sp:after{content:'';position:absolute;bottom:-14px;left:26px;border:8px solid transparent;border-top-color:#2a1840}
.sp:nth-of-type(even):after{left:auto;right:26px}

.hint{grid-column:1/3;font-size:13px;opacity:.7;font-weight:600;margin-top:-2px}

.cnt{position:absolute;right:-4px;top:-4px;background:#ff3b6f;color:#fff;border-radius:999px;font-size:13px;padding:0 6px;border:2px solid #2a1840;font-weight:800}
#wa{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(122px + env(safe-area-inset-top,0px));z-index:6;width:min(270px,72vw);background:#fff;color:#111;border-radius:12px;box-shadow:0 6px 0 rgba(0,0,0,.25);overflow:hidden;font-size:14px;font-weight:600;animation:rise .3s both}

.wanted{font-size:46px;font-weight:800;text-align:center;letter-spacing:6px;border-bottom:4px solid #2a1840;margin-bottom:4px;line-height:1.1}

.lv em.q{display:block;font-size:12px;font-style:normal;opacity:.75;margin-top:3px;line-height:1.1}

canvas#c{touch-action:none}

 #topL{max-width:calc(50vw - 62px);padding:3px 8px}

</style>

(function(){

let lastShout=0;
function shout(o,force){
  const L=SHOUT[o.type];if(!L)return;
  const ln=L[(Math.random()*L.length)|0];
  say(o,ln[0],2.8,2.7);
  const now=performance.now();
  if(o.type==='dog'||muted||!SET.voice||!('speechSynthesis' in window)||!nearMe(o,28))return;
  if(!force&&now-lastShout<2600)return;
  lastShout=now;
  try{
    pickVoice();const T0=TALK[o.type]||TALK.uncle,hi=!!hiVoice;
    const u=new SpeechSynthesisUtterance(hi?ln[1].replace(/बंटी/g,CHAR.hi):nm(ln[0]));
    if(hi){u.voice=hiVoice;u.lang=hiVoice.lang}else{u.lang='en-IN';if(enVoice)u.voice=enVoice}
    u.pitch=T0.p;u.rate=T0.r;u.volume=1;speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
function stepOwner(o,dt,list){
  const C=OT[o.type];o.cd-=dt;
  if(o.slip>0){o.slip-=dt;o.spdNow=0;return}
  if(o.type!=='dog'&&o.state!=='wait'){for(const pl of peels){if(pl.on&&Math.abs(pl.x-o.x)<.9&&Math.abs(pl.z-o.z)<.9){slipOwner(o,pl);return}}}
  if(o.state==='wait'){
    o.t-=dt;
    if(o.t<=0){const d=o.door;o.state='search';o.stage=0;o.t=C.search;o.x=d.x;o.z=d.z-d.face*.6;o.rot=d.face>0?0:Math.PI;o.mesh.visible=true;o.noclip=true;
      shout(o,true);if(o.type==='dog'&&nearMe(o))sfx('bark');}
    return;
  }
  // detection
  let best=null,bs=0;
  for(const p of list){if(!p.alive)continue;const s=senses(o,p,C);if(s>bs){bs=s;best=p}}
  if(best){o.lastX=best.x;o.lastZ=best.z;o.lost=0;
    if(o.state!=='chase'){o.aware+=dt*(.5+bs*1.9)*(C.alert||1)*DIFFA[SET.diff];if(o.aware>=1)startChase(o,best)}else o.tgt=best.id;
  }else{o.aware=Math.max(0,o.aware-dt*.6);o.lost+=dt}
  if(C.sense&&(o.state==='patrol'||o.state==='search')){
    let sd=1e9,sp=null;
    for(const p of list){if(!p.alive||p.safeT>0)continue;const dd=Math.hypot(p.x-o.x,p.z-o.z),rr=C.sense*(p.crouch?.6:1)*(p.run?1.3:1)*DIFFR[SET.diff];if(dd<rr&&dd<sd){sd=dd;sp=p}}
    if(sp){
      o.senseT=(o.senseT||0)+dt;o.rot+=angDiff(o.rot,Math.atan2(sp.x-o.x,sp.z-o.z))*Math.min(1,dt*3);
      if(o.state==='patrol'&&o.senseT>.6){o.state='search';o.stage=2;o.t=7;o.alertX=sp.x;o.alertZ=sp.z;o.pause=1.0;pickWander(o);o.aware=Math.max(o.aware,.3);say(o,['Koi hai kya? Mujhe kuch mehsoos hua…','Hmm… yahan aas-paas koi hai!','Bunty? Tu yahin hai kya?'][(Math.random()*3)|0],2.4,2.7);if(nearMe(o,30))talk('guard')}
    }else o.senseT=Math.max(0,(o.senseT||0)-dt*1.5);
  }
  switch(o.state){
    case 'search':{
      o.t-=dt;
      o.sh=(o.sh||0)-dt;if(o.sh<=0&&o.stage>=1){o.sh=3.6+Math.random()*2.6;if(o.type==='dog'){if(nearMe(o,28))sfx('bark')}else if(nearMe(o,40))shout(o)}
      if(o.stage===0){
        const tx=o.door?o.door.sx:o.alertX,tz=o.door?o.door.sz:o.alertZ;
        o.noclip=!!o.door&&Math.hypot(o.x-tx,o.z-tz)<3.2;
        if(walk(o,tx,tz,C.spd,dt)){o.stage=1;o.noclip=false}
      }else if(o.stage===1){
        if(walk(o,o.alertX,o.alertZ,C.spd,dt)){o.stage=2;o.pause=1.2;pickWander(o)}
      }else{
        if(o.pause>0){o.pause-=dt;o.rot+=Math.sin(gameTime*3+o.id)*dt*2.2;o.spdNow=0}
        else if(walk(o,o.wx,o.wz,C.spd*.9,dt)){o.pause=1.3;pickWander(o)}
      }
      if(o.t<=0){if(C.lose&&Math.random()<.5)say(o,C.lose,2.4);goHome(o)}
      break}
    case 'chase':{
      const p=list.find(q=>q.id===o.tgt);
      if(!p||!p.alive){o.state='search';o.stage=1;o.t=5;o.aware=0;o.alertX=o.x;o.alertZ=o.z;break}
      o.ch+=dt;const vis=o.lost<.25;
      const tx=vis?p.x:o.lastX,tz=vis?p.z:o.lastZ;
      walk(o,tx,tz,C.chase*MOD.spd*(o.type==='dog'&&o.ch>C.give-1.6?.6:1),dt);
      const d=Math.hypot(p.x-o.x,p.z-o.z);
      if(p===me&&d<C.reach)caughtMe(o);
      if(C.throws&&o.cd<=0&&vis&&d>(C.tmin||3)&&d<(C.tmax||10)){o.cd=C.tcd||2.8;throwChappal(o,p)}
      if(o.lost>1.6){o.state='search';o.stage=1;o.t=7;o.alertX=o.lastX;o.alertZ=o.lastZ;o.aware=0;if(o.type!=='dog')say(o,'Kahan gaya woh…?',1.8)}
      else if(o.ch>C.give){if(C.lose)say(o,C.lose,2.4);goHome(o)}
      break}
    case 'return':{
      const d=o.door;if(!d){o.state='patrol';break}
      const dd=Math.hypot(o.x-d.sx,o.z-d.sz);if(dd<.7)o.entering=true;
      o.noclip=o.entering||dd<3.2;
      const tx=o.entering?d.x:d.sx,tz=o.entering?d.z-d.face*1.1:d.sz;
      if(walk(o,tx,tz,C.spd*1.1,dt)&&o.entering){d.cool=6;o.dead=true}
      break}
    case 'patrol':{
      if((o.senseT||0)>.05){o.spdNow=0;break}
      if(o.type==='guard'){o.sh=(o.sh||0)-dt;if(o.sh<=0){o.sh=9+Math.random()*6;if(nearMe(o,30))say(o,PATROLL[(Math.random()*PATROLL.length)|0],2.6,2.7)}}
      const rt=ROUTES[o.route],wp=rt[o.wp%rt.length];
      if(o.pause>0){o.pause-=dt;o.rot+=Math.sin(gameTime*2.4+o.id)*dt*1.4;o.spdNow=0}
      else if(walk(o,wp[0],wp[1],C.spd,dt)){o.pause=1.6;o.wp=(o.wp+1)%rt.length}
      break}
  }
}
const PROJ=[{c:0xff8fab,s:[.4,.07,.18]},{c:0x8b5a2b,s:[1.1,.09,.1]},{c:0xff9f1c,s:[.32,.32,.32]},{c:0x38bdf8,s:[.3,.3,.3]}];
const PKIND={aunty:0,dadaji:1,pandit:2,maali:3},PLINE=['Ye le chappal!','Ye le meri lathi!','Ye le prasad, Ram Ram!','Ye le paani!'];
function throwChappal(o,p,noHit){
  const k=PKIND[o.type]|0,PJ=PROJ[k];
  const dx=p.x-o.x,dz=p.z-o.z,d=Math.hypot(dx,dz)||1,sp=noHit?18:(k===1?12:15);
  const m=new T.Mesh(gBox,M(PJ.c));m.scale.set(PJ.s[0],PJ.s[1],PJ.s[2]);m.castShadow=SHADOWS;scene.add(m);
  projs.push({x:o.x,z:o.z,vx:dx/d*sp,vz:dz/d*sp,t:noHit?.7:1.2,mesh:m,own:true,k,noHit:!!noHit});
  if(!noHit)say(o,PLINE[k],1.4);
}
function hitMe(k){
  if(!me.alive)return;buzz(90);me.stun=k===3?1.6:1.4;sfx('thwack');setTimeout(()=>sfx('boing'),150);talk('ohno',true);
  if(k===1)meme('🦯','Dadaji ki lathi! “Hamare zamane mein aise nahi karte!”');

function alertNearby(o,p){
  for(const q of owners){
    if(q===o||q.remote||q.state==='wait'||q.state==='chase')continue;
    if(Math.hypot(q.x-o.x,q.z-o.z)<26){
      q.aware=Math.max(q.aware,.6);
      if(q.state==='patrol'||q.state==='return'||q.state==='search'){q.state='search';q.stage=1;q.t=Math.max(q.t,8);q.alertX=p.x;q.alertZ=p.z;q.noclip=false;q.entering=false}
    }
  }
}
function catchAction(o){

function updateProjs(dt){
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];p.t-=dt;p.x+=p.vx*dt;p.z+=p.vz*dt;p.mesh.position.set(p.x,1.1,p.z);p.mesh.rotation.y+=dt*18;
    let kill=p.t<=0;
    if(!kill&&!p.noHit&&me.alive&&Math.hypot(p.x-me.x,p.z-me.z)<.85){hitMe(p.k);kill=true}
    if(!kill)for(const s of solids){if(s.h>1.3&&p.x>s.x0&&p.x<s.x1&&p.z>s.z0&&p.z<s.z1){kill=true;break}}
    if(kill){scene.remove(p.mesh);projs.splice(i,1)}
  }
}
function simOwners(dt){
  const list=plist();

    const o=owners[i];if(o.remote)continue;

function updateCamera(dt){

  updateRotateHint();
}
function updateRotateHint(){
  const el=$('rotate');
  const need=TUI()&&SET.orient==='landscape'&&innerHeight>innerWidth&&(mode==='play'||mode==='pause'||mode==='brief');
  el.classList.toggle('hide',!need);
  if(need&&mode==='play'&&KIND==='story'){mode='pause';rotPaused=true}
  else if(!need&&rotPaused){if(mode==='pause')mode='play';rotPaused=false}
}
$('rotate').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;A();if(b.dataset.r==='try')lockOrientation();else{applySet('orient','auto');lockOrientation()}});
function toggleFS(){try{const d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const e=d.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}}catch(err){}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(mode==='play'&&KIND==='story')openPause();if(AC&&AC.state==='running')AC.suspend().catch(()=>{});try{speechSynthesis.cancel()}catch(e){}}
  else if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>{if(mode==='play')e.preventDefault()});
document.addEventListener('pointerdown',()=>{A()},{once:true});
let aqW=0,aqT=0,aqF=0,aqN=0;
let lastT=performance.now();
let fpsAcc=0,fpsN=0;
function frame(now){
  requestAnimationFrame(frame);
  const raw=(now-lastT)/1000,dt=Math.min(.05,Math.max(0,raw));lastT=now;fpsAcc+=raw;fpsN++;
  if(mode==='play'&&SET.autoQ&&SET.quality!=='low'&&aqN<2&&raw<1){aqW+=raw;if(aqW>3){aqT+=raw;aqF++;if(aqT>=6){const f=aqF/aqT;aqT=0;aqF=0;if(f<26){const nq=SET.quality==='high'?'medium':'low';applySet('quality',nq);aqN++;aqW=0;meme('⚙️','Graphics adjusted for smoother play ('+nq+')',2200)}}}}else if(mode!=='play'){aqW=0;aqT=0;aqF=0}if(fpsAcc>=.5){if(SET.fps)$('fps').textContent=Math.round(fpsN/fpsAcc)+' FPS';fpsAcc=0;fpsN=0}
  try{update(dt)}catch(e){console.error(e)}
  renderer.render(scene,camera);
}
buildWorld();drawStaticMini();applySettings();
friends.forEach(f=>f.mesh.visible=false);me.mesh.visible=false;
showMenu();window.__gameOk=true;requestAnimationFrame(frame);
})();
